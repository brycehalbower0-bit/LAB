name: retro-emulator

on:
  # Manual trigger: path filters mean an empty commit can't retrigger a
  # run after an Actions outage.
  workflow_dispatch:
  push:
    # claude/** so the no-local-compiler workflow (Windows dev box, no PR
    # flow) still gets its C/C++ compile gate before anything reaches EAS.
    branches: [main, "claude/**"]
    paths: ["retro-emulator-ios/**", ".github/workflows/retro-emulator.yml"]
  pull_request:
    paths: ["retro-emulator-ios/**", ".github/workflows/retro-emulator.yml"]

concurrency:
  group: retro-emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundations:
    name: Cores · Spike · Contract tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: retro-emulator-ios
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # Ground truth for the EmuCore podspec: exactly which core sources
      # compile and with which defines. Read from the run log when the
      # vendored module's file list or flags need updating.
      - name: Dump core compile manifests
        run: |
          for CORE in GBA NDS; do
            echo "=== Cores/$CORE compiled sources ==="
            jq -r '.[].file' build/compile_commands.json | grep "Cores/$CORE" | sed "s|.*/Cores/$CORE/||" | sort
            echo "=== Cores/$CORE compile defines ==="
            jq -r --arg core "Cores/$CORE" '.[] | select(.file | contains($core)) | .command' build/compile_commands.json | grep -oE '\-D[A-Za-z0-9_=]+' | sort -u
          done

  core-3ds-experimental:
    name: 3DS core · headless no-JIT (experimental, non-gating)
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: retro-emulator-ios
    steps:
      - uses: actions/checkout@v4

      - name: Configure (dyncom, no JIT, no GL, no keyblob)
        run: cmake -S Cores/3DS/azahar -B build3ds -C Cores/3DS/no-jit-headless.cmake -DCMAKE_BUILD_TYPE=Release -DEMU_SHARED_ABI_ADAPTER=ON

      - name: Build adapter + contract test
        run: cmake --build build3ds --target c3ds_core_tests -j $(nproc)

      # Azahar redirects runtime output to bin/<CONFIG>/.
      - name: Run 3DS contract test
        run: ./build3ds/bin/Release/c3ds_core_tests

      - name: Verify zero key material in binaries
        run: |
          ! nm -C build3ds/bin/Release/c3ds_core_tests 2>/dev/null | grep -i "default_keys"
          echo "no embedded keyblob symbols"

  app-shell:
    name: Expo shell · typecheck · vendored-spike drift
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: retro-emulator-ios/App
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: retro-emulator-ios/App/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The native modules carry vendored copies of canonical sources
      # (Spikes/arm11-interp, Cores/Shared, Tests/CoreTests); fail if
      # someone edited one side without re-syncing.
      - name: Vendored copies are in sync
        run: |
          npm run sync-spike
          npm run sync-emu-core
          git diff --exit-code -- modules/spike-bench/ios/cpp modules/emu-core/ios/cpp
