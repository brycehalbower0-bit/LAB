name: retro-emulator

on:
  # Manual trigger: path filters mean an empty commit can't retrigger a
  # run after an Actions outage.
  workflow_dispatch:
  push:
    # claude/** so the no-local-compiler workflow (Windows dev box, no PR
    # flow) still gets its C/C++ compile gate before anything reaches EAS.
    branches: [main, "claude/**"]
    paths: ["retro-emulator-ios/**", ".github/workflows/retro-emulator.yml"]
  pull_request:
    paths: ["retro-emulator-ios/**", ".github/workflows/retro-emulator.yml"]

concurrency:
  group: retro-emulator-${{ github.ref }}
  # The 3DS core build takes ~20 min; cancelling in-progress runs meant
  # any push during that window threw the result away. Let runs finish.
  cancel-in-progress: false

jobs:
  foundations:
    name: Cores · Spike · Contract tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: retro-emulator-ios
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # Ground truth for the EmuCore podspec: exactly which core sources
      # compile and with which defines. Read from the run log when the
      # vendored module's file list or flags need updating.
      - name: Dump core compile manifests
        run: |
          for CORE in GBA NDS; do
            echo "=== Cores/$CORE compiled sources ==="
            jq -r '.[].file' build/compile_commands.json | grep "Cores/$CORE" | sed "s|.*/Cores/$CORE/||" | sort
            echo "=== Cores/$CORE compile defines ==="
            jq -r --arg core "Cores/$CORE" '.[] | select(.file | contains($core)) | .command' build/compile_commands.json | grep -oE '\-D[A-Za-z0-9_=]+' | sort -u
          done

  core-3ds-experimental:
    name: 3DS core · headless no-JIT (experimental, non-gating)
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: retro-emulator-ios
    steps:
      - uses: actions/checkout@v4

      - name: Configure (dyncom, no JIT, no GL, no keyblob)
        run: cmake -S Cores/3DS/azahar -B build3ds -C Cores/3DS/no-jit-headless.cmake -DCMAKE_BUILD_TYPE=Release -DEMU_SHARED_ABI_ADAPTER=ON

      - name: Build adapter + contract test
        run: cmake --build build3ds --target c3ds_core_tests -j $(nproc)

      # Azahar redirects runtime output to bin/<CONFIG>/.
      # Run under gdb with a throw catchpoint: Citra's exceptions are
      # bare unordered_map::at failures whose what() names nothing, so a
      # backtrace is the only thing that localizes them.
      # Run plainly; only on failure re-run under gdb for a backtrace
      # (gdb -batch exits non-zero when `bt` finds no stack, so it can't
      # be the primary runner).
      - name: Run 3DS contract test
        run: |
          BIN=./build3ds/bin/Release/c3ds_core_tests
          if "$BIN"; then
            exit 0
          fi
          echo "--- test failed; retrying under gdb for a backtrace ---"
          sudo apt-get update -qq >/dev/null 2>&1 || true
          sudo apt-get install -y --no-install-recommends gdb >/dev/null 2>&1 || true
          if command -v gdb >/dev/null; then
            gdb -batch -ex "catch throw" -ex run -ex bt --args "$BIN" || true
          fi
          exit 1

      - name: Verify zero key material in binaries
        run: |
          ! nm -C build3ds/bin/Release/c3ds_core_tests 2>/dev/null | grep -i "default_keys"
          echo "no embedded keyblob symbols"

  app-shell:
    name: Expo shell · typecheck · vendored-spike drift
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: retro-emulator-ios/App
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: retro-emulator-ios/App/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The canonical core trees are pristine upstream snapshots, so every
      # file in them must be committed. The repo's own ignore rules do not
      # know that: patterns meant for our build output (build/, *.P*) reach
      # into the vendored trees and silently drop upstream sources, which
      # then exist locally, get synced, and vanish on a fresh checkout --
      # surfacing as unexplained drift rather than a missing file. Files
      # under an ignored directory cannot be re-included by a negation, so
      # they are force-added; this check is what makes that visible.
      - name: No ignored files in the canonical core trees
        working-directory: .
        run: |
          leaked=$(git ls-files --others --ignored --exclude-standard \
            -- retro-emulator-ios/Cores/ retro-emulator-ios/Spikes/)
          if [ -n "$leaked" ]; then
            echo "Ignored-but-present files in a vendored tree:"
            echo "$leaked"
            echo "Commit them with: git add -f <paths>"
            exit 1
          fi

      # The native modules carry vendored copies of canonical sources
      # (Spikes/arm11-interp, Cores/Shared, Tests/CoreTests); fail if
      # someone edited one side without re-syncing.
      - name: Vendored copies are in sync
        run: |
          npm run sync-spike
          npm run sync-emu-core
          git diff --exit-code -- modules/spike-bench/ios/cpp modules/emu-core/ios/cpp
